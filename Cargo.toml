[workspace]
resolver = "2"

members = [
  "cli",
  "configuration",
  "exchange",
  "integration-tests",
  "oms",
  "recorder",
  "strategy"
]

[workspace.package]
# If this version is changed, amend the edition set in `rustfmt.toml`.
edition = "2024"
# If this version is changed, amend the version set in `rust-toolchain.toml`.
rust-version = "1.96.0"
# Prevent publishing by accident.
publish = false
repository = "https://github.com/Eagle941/mma"
readme = "README.md"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "fat" # link time optimization using using whole-program analysis
codegen-units = 1 # optimization over all codebase ( better optimization, slower build )
overflow-checks = true # Keep overflow checks in production builds.
panic = "abort"
opt-level = 3 # All optimisations
debug = true # Added for testing in release mode. TODO: Remove for production

[workspace.dependencies]
assert_approx_eq = "1.1.0"
criterion = { version = "0.8.2", features = ["html_reports"] }
crossbeam-channel = "0.5.15"
crossbeam-queue = "0.3.12"
log = "0.4.29"
log-execution-time = "0.1.0"
rstest = "0.26.1"
tokio = { version = "1.53.0", features = ["full"] }
triple_buffer = "8.1.1"
