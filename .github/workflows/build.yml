name: CI
on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: "-Cforce-frame-pointers=yes" # GH doesn't handle the flag cpu-native

jobs:
    build:
        name: Test
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout source
              uses: actions/checkout@v7
            - name: Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: "build-cache"
                  cache-all-crates: "true"
                  cache-directories: |
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
            - name: Build
              run: cargo build --locked
            - name: Run tests
              run: |
                  id -a
                  sudo apt-get -y install build-essential pkg-config libssl-dev
                  cargo test --workspace --all-features --locked

    clippy:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout source
              uses: actions/checkout@v7
            - name: Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: "clippy-cache"
                  cache-all-crates: "true"
                  cache-directories: |
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
            - name: Cargo clippy
              run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

    lint:
        name: Formatting
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout source
              uses: actions/checkout@v7
            - name: Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: "fmt-cache"
                  cache-all-crates: "true"
                  cache-directories: |
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
            - name: Install nightly Rustfmt
              run: rustup toolchain install nightly-2026-07-20 --profile minimal --component rustfmt
            - name: Cargo fmt
              run: cargo  +nightly-2026-07-20 fmt --all -- --check

    doc:
        name: Documentation
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout source
              uses: actions/checkout@v7
            - name: Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: "doc-cache"
                  cache-all-crates: "true"
                  cache-directories: |
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
            - name: Cargo doc
              env:
                  RUSTDOCFLAGS: "-D warnings"
              run: cargo doc --workspace --all-features --no-deps --document-private-items --locked
